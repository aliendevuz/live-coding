# Builds Duet for Windows (.exe installer) and macOS (.dmg, Intel + Apple Silicon).
#
# Setup once, in the GitHub repository:
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable
#     SIGNALING_URL = your Lambda Function URL (baked into the apps)
#
# Run: Actions -> "Build Duet" -> Run workflow (or push a tag like v0.4.0).
# Download the installers from the run's "Artifacts" section.
name: Build Duet

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            artifact: duet-windows
            paths: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: duet-macos
            paths: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Signaling URL
        shell: bash
        run: echo "VITE_SIGNALING_URL=${{ vars.SIGNALING_URL }}" > .env.production

      - run: npm ci

      # Ad-hoc signed on macOS (free): students open it once via
      # System Settings -> Privacy & Security -> "Open Anyway".
      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
